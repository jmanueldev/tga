version: "3.9"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tga
      POSTGRES_PASSWORD: tga
      POSTGRES_DB: tga
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://tga:tga@postgres:5432/tga
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"